
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お店まるごとメーカー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f3ef;color:#292d29;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{padding:22px 18px;background:#243d32;color:white}
header h1{font-size:23px;margin:0}
header p{font-size:13px;margin:6px 0 0}
main{max-width:900px;margin:auto;padding:16px}
.panel{background:white;border-radius:16px;padding:18px;margin-bottom:18px}
h2{font-size:19px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:bold;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d5d8d2;border-radius:9px;font-size:16px;background:white}
textarea{min-height:75px}
button{padding:12px;border:0;border-radius:9px;background:#345b45;color:white;font-size:15px;font-weight:bold;cursor:pointer}
.action{width:100%;margin-top:14px}
.designs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.designs button{background:#e9ece7;color:#333}
.designs button.active{background:#345b45;color:white}
.preview{border:1px solid #ddd;border-radius:14px;overflow:hidden;background:white}
.hero{text-align:center;padding:48px 18px;background:#e8eee4;color:#294534}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase}
.hero h3{font-family:Georgia,serif;font-size:32px;margin:15px 0}
.hero p{line-height:1.9}
.shopbody{padding:22px}
.shopbody h4{font-size:18px;margin:24px 0 10px}
.menuitem{padding:12px 0;border-bottom:1px solid #eee;white-space:pre-wrap}
.small{font-size:12px;color:#777}
.preview.dark .hero{background:#292724;color:#f6ead6}
.preview.dark{background:#f9f5ee}
.preview.pink .hero{background:#f9e8ed;color:#80485b}
.preview.pink{background:#fffaf9}
.preview.modern .hero{background:#e7f2f7;color:#204c63}
.preview.modern{background:#fff}
.preview.dark .hero h3{font-family:Georgia,serif;letter-spacing:2px}
.preview.modern .hero{text-align:left}
.preview.modern .hero h3{font-family:Arial,sans-serif}
@media(min-width:650px){main{padding:24px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}}
</style>
</head>
<body>
<header>
<h1>お店まるごとメーカー</h1>
<p>お店の魅力を、ホームページに。</p>
</header>
<main>
<section class="panel">
<h2>① お店の情報</h2>
<label for="shop">お店の名前</label>
<input id="shop" value="喫茶 こもれび">
<label for="category">業種</label>
<select id="category">
<option>カフェ</option><option>レストラン</option><option>居酒屋</option><option>美容室</option><option>整体・サロン</option><option>雑貨店</option><option>その他</option>
</select>
<label for="desc">お店の紹介</label>
<textarea id="desc">ゆったりとした時間を過ごせる、街角の小さなカフェです。</textarea>
<label for="hours">営業時間</label>
<input id="hours" value="10:00〜18:00">
<label for="holiday">定休日</label>
<input id="holiday" value="毎週水曜日">
<label for="menu">メニュー（1行に1品）</label>
<textarea id="menu">ブレンドコーヒー　500円
季節のケーキ　600円
本日のランチ　1,200円</textarea>
<button class="action" onclick="generate()">入力内容をプレビューに反映</button>
</section>
<section class="panel">
<h2>② デザインを選ぶ</h2>
<div class="designs">
<button class="active" onclick="setDesign('natural',this)">🌿 ナチュラル</button>
<button onclick="setDesign('dark',this)">🖤 高級・シック</button>
<button onclick="setDesign('pink',this)">🌸 かわいい</button>
<button onclick="setDesign('modern',this)">🩵 モダン</button>
</div>
</section>
<section class="panel">
<h2>③ ホームページのプレビュー</h2>
<div id="preview" class="preview">
<div class="hero">
<div class="eyebrow" id="categoryView">CAFE</div>
<h3 id="shopView">喫茶 こもれび</h3>
<p id="descView">ゆったりとした時間を過ごせる、街角の小さなカフェです。</p>
</div>
<div class="shopbody">
<p>営業時間：<strong id="hoursView"></strong></p>
<p>定休日：<strong id="holidayView"></strong></p>
<h4>MENU</h4>
<div id="menuView"></div>
<p class="small">※現在はデザイン確認用のプレビューです。</p>
</div>
</div>
</section>
</main>
<script>
function generate(){
const get=id=>document.getElementById(id).value;
document.getElementById('shopView').textContent=get('shop')||'お店の名前';
document.getElementById('categoryView').textContent=get('category');
document.getElementById('descView').textContent=get('desc');
document.getElementById('hoursView').textContent=get('hours');
document.getElementById('holidayView').textContent=get('holiday');
const menu=document.getElementById('menuView');
menu.replaceChildren();
get('menu').split('\n').filter(x=>x.trim()).forEach(line=>{
const item=document.createElement('div');
item.className='menuitem';
item.textContent=line;
menu.appendChild(item);
});
}
function setDesign(style,button){
document.getElementById('preview').className='preview '+(style==='natural'?'':style);
document.querySelectorAll('.designs button').forEach(b=>b.classList.remove('active'));
button.classList.add('active');
}
generate();
</script>
</body>
</html>
